- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
    update_cache: yes
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Add Vivaldi GPG key
  ansible.builtin.get_url:
    url: https://repo.vivaldi.com/archive/linux_signing_key.pub
    dest: /usr/share/keyrings/vivaldi-archive-keyring.asc
    mode: '0644'
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Add Vivaldi Repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/vivaldi-archive-keyring.asc] https://repo.vivaldi.com/archive/deb/ stable main"
    filename: vivaldi
    state: present
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Install Ubuntu packages
  become: yes
  apt:
    update_cache: yes
    cache_valid_time: 86400 #1 day
    name:
    - python3-gpg
    - python3-venv
    - openssh-server
    - keepassxc-full
    - libappindicator3-1
    - calibre
    - stow
    - build-essential
    - krdc
    - vivaldi-stable
    - openvpn
    - net-tools
    - syncthing
    - input-remapper-gtk
    - evtest
    - uidmap
    - ncdu
    - fzf
    - ripgrep
    - pandoc
    - kitty
    - xsel
    - pipx
    state: present
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Install Docker packages from docker.com
  become: yes
  apt:
    update_cache: yes
    cache_valid_time: 86400 #1 day
    name:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
    state: present
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Remove Ubuntu packages
  become: yes
  apt:
    name:
    - neovim
    state: absent
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: "Install xmind snap"
  community.general.snap:
    name: xmind
    state: present
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Gather existing groups
  ansible.builtin.getent:
    database: group
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: "Add {{ myuser }} to existing groups"
  ansible.builtin.user:
    name: "{{ myuser }}"
    groups: "{{ item }}"
    append: yes
  loop:
    - dialout
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - item in (getent_group | default({}))

- name: Ubuntu enable service ssh and start it
  ansible.builtin.service:
    name: ssh
    enabled: yes
    state: started
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: "Ubuntu enable service syncthing@{{ myuser }} and start it"
  ansible.builtin.service:
    name: "syncthing@{{ myuser }}"
    enabled: yes
    state: started
  when: ansible_facts['distribution'] == 'Ubuntu'
